# Recovery rehearsal only: no application, worker, published ports or egress.
# Files and certificate volumes are populated offline, not mounted in PostgreSQL.
services:
  postgres:
    image: ${RESTORE_POSTGRES_IMAGE:?recorded snapshot image required}
    environment:
      POSTGRES_DB: prosepect
      POSTGRES_USER: prosepect
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?snapshot config required}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U prosepect -d prosepect"]
      interval: 3s
      timeout: 3s
      retries: 30
volumes:
  postgres-data:
networks:
  default:
    internal: true
