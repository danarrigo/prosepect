# Recovery rehearsal only: no application, worker, published ports or egress.
services:
  postgres:
    image: ${RESTORE_POSTGRES_IMAGE:?recorded snapshot image required}
    environment:
      POSTGRES_DB: prosepect
      POSTGRES_USER: prosepect
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?snapshot config required}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U prosepect -d prosepect"]
      interval: 3s
      timeout: 3s
      retries: 30
  minio:
    image: ${RESTORE_MINIO_IMAGE:?recorded snapshot image required}
    command: server /data --console-address ':9001'
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY_ID:?snapshot config required}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_ACCESS_KEY:?snapshot config required}
      MINIO_BROWSER: "off"
    volumes:
      - minio-data:/data
    healthcheck:
      test: [CMD, curl, --fail, --silent, http://localhost:9000/minio/health/live]
      interval: 3s
      timeout: 3s
      retries: 30
volumes:
  postgres-data:
  minio-data:
networks:
  default:
    internal: true
