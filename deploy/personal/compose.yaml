name: prosepect-personal

x-runtime: &runtime
  APP_ENV: production
  ALLOW_INSECURE_DEV_AUTH: "false"
  INVITE_ONLY: "true"
  MAX_USER_ACCOUNTS: "1"
  DATABASE_URL: postgres://prosepect:${POSTGRES_PASSWORD:?configure first}@postgres:5432/prosepect
  APP_URL: https://${APP_HOST:?configure first}
  CORS_ALLOWED_ORIGIN: https://${APP_HOST:?configure first}
  TRUST_PROXY_HEADERS: "true"
  GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:?configure first}
  GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:?configure first}
  GOOGLE_REDIRECT_URI: https://${APP_HOST}/api/v1/auth/google/callback
  GOOGLE_CALENDAR_WEBHOOK_URL: https://${APP_HOST}/webhooks/google/calendar
  TOKEN_ENCRYPTION_KEY: ${TOKEN_ENCRYPTION_KEY:?configure first}
  S3_BUCKET: prosepect
  S3_REGION: us-east-1
  S3_ENDPOINT: http://minio:9000
  S3_PUBLIC_ENDPOINT: https://${STORAGE_HOST:?configure first}
  S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:?configure first}
  S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:?configure first}
  # HTTP is permitted only for the unpublished, container-network endpoint.
  S3_ALLOW_HTTP: "true"
  S3_VIRTUAL_HOSTED_STYLE: "false"
  MAX_FILE_SIZE_BYTES: "26214400"
  MAX_USER_FILE_STORAGE_BYTES: "1073741824"
  MAX_TOTAL_FILE_STORAGE_BYTES: "1073741824"
  RUST_LOG: prosepect_api=info,tower_http=info

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: prosepect
      POSTGRES_USER: prosepect
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?configure first}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U prosepect -d prosepect"]
      interval: 5s
      timeout: 3s
      retries: 30

  minio:
    image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: server /data --console-address ':9001'
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY_ID:?configure first}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_ACCESS_KEY:?configure first}
      MINIO_BROWSER: "off"
    volumes:
      - minio-data:/data
    healthcheck:
      test: [CMD, curl, --fail, --silent, http://localhost:9000/minio/health/live]
      interval: 5s
      timeout: 3s
      retries: 30

  minio-init:
    image: quay.io/minio/mc:RELEASE.2025-08-13T08-35-41Z
    restart: "no"
    depends_on:
      minio:
        condition: service_healthy
    environment:
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:?configure first}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:?configure first}
    entrypoint: [/bin/sh, -ec]
    command:
      - |
        export MC_HOST_local="http://$${S3_ACCESS_KEY_ID}:$${S3_SECRET_ACCESS_KEY}@minio:9000"
        mc mb --ignore-existing local/prosepect
        mc anonymous set none local/prosepect

  api:
    build:
      context: ../..
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    environment:
      <<: *runtime
      BIND_ADDRESS: 0.0.0.0:3000
      DATABASE_MAX_CONNECTIONS: "10"
      ADMIN_USER_IDS: ${ADMIN_USER_IDS:-}
    depends_on:
      postgres:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    healthcheck:
      test: [CMD, curl, --fail, --silent, http://localhost:3000/ready]
      interval: 5s
      timeout: 3s
      retries: 30

  worker:
    build:
      context: ../..
      dockerfile: apps/api/Dockerfile
    entrypoint: [prosepect-worker]
    restart: unless-stopped
    environment:
      <<: *runtime
      DATABASE_MAX_CONNECTIONS: "5"
    depends_on:
      api:
        condition: service_healthy
    # Process liveness only; queue progress must be checked separately.
    healthcheck:
      test: [CMD-SHELL, "kill -0 1"]
      interval: 30s
      timeout: 3s
      retries: 3

  web:
    build:
      context: ../..
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    environment:
      APP_HOST: ${APP_HOST:?configure first}
      STORAGE_HOST: ${STORAGE_HOST:?configure first}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./routes.caddy:/etc/caddy/routes.caddy:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, http://127.0.0.1:8081/health]
      interval: 10s
      timeout: 3s
      retries: 15

volumes:
  postgres-data:
  minio-data:
  caddy-data:
  caddy-config:
