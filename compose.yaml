name: prosepect

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: prosepect
      POSTGRES_USER: prosepect
      POSTGRES_PASSWORD: prosepect
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U prosepect -d prosepect"]
      interval: 3s
      timeout: 3s
      retries: 20
    volumes:
      - postgres-data:/var/lib/postgresql/data

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      APP_ENV: development
      BIND_ADDRESS: 0.0.0.0:3000
      DATABASE_URL: postgres://prosepect:prosepect@postgres:5432/prosepect
      DATABASE_MAX_CONNECTIONS: 10
      CORS_ALLOWED_ORIGIN: http://localhost:8080
      ALLOW_INSECURE_DEV_AUTH: "true"
      RUST_LOG: prosepect_api=info,tower_http=info
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:3000/ready"]
      interval: 5s
      timeout: 3s
      retries: 20

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "127.0.0.1:8080:80"

volumes:
  postgres-data:
