name: prosepect

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: prosepect
      POSTGRES_USER: prosepect
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-prosepect}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U prosepect -d prosepect"]
      interval: 3s
      timeout: 3s
      retries: 20
    volumes:
      - postgres-data:/var/lib/postgresql/data

  minio:
    image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY_ID:-prosepect}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_ACCESS_KEY:-prosepect-development-secret}
    ports:
      - "127.0.0.1:9000:9000"
    volumes:
      - minio-data:/data

  minio-init:
    image: quay.io/minio/mc:RELEASE.2025-08-13T08-35-41Z
    depends_on:
      - minio
    environment:
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-prosepect}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-prosepect-development-secret}
    entrypoint: >-
      /bin/sh -c '
      until mc alias set local http://minio:9000 $${S3_ACCESS_KEY_ID:-prosepect} $${S3_SECRET_ACCESS_KEY:-prosepect-development-secret}; do sleep 1; done;
      mc mb --ignore-existing local/prosepect;
      '

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      APP_ENV: ${APP_ENV:-development}
      BIND_ADDRESS: 0.0.0.0:3000
      DATABASE_URL: postgres://prosepect:${POSTGRES_PASSWORD:-prosepect}@postgres:5432/prosepect
      DATABASE_MAX_CONNECTIONS: 10
      CORS_ALLOWED_ORIGIN: ${APP_URL:-http://localhost:8080}
      APP_URL: ${APP_URL:-http://localhost:8080}
      ALLOW_INSECURE_DEV_AUTH: ${ALLOW_INSECURE_DEV_AUTH:-true}
      INVITE_ONLY: ${INVITE_ONLY:-false}
      MAX_USER_ACCOUNTS: ${MAX_USER_ACCOUNTS:-}
      TRUST_PROXY_HEADERS: "true"
      S3_BUCKET: prosepect
      S3_REGION: us-east-1
      S3_ENDPOINT: http://minio:9000
      S3_PUBLIC_ENDPOINT: ${S3_PUBLIC_ENDPOINT:-http://localhost:9000}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-prosepect}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-prosepect-development-secret}
      S3_ALLOW_HTTP: "true"
      S3_VIRTUAL_HOSTED_STYLE: "false"
      MAX_FILE_SIZE_BYTES: ${MAX_FILE_SIZE_BYTES:-26214400}
      MAX_USER_FILE_STORAGE_BYTES: ${MAX_USER_FILE_STORAGE_BYTES:-104857600}
      MAX_TOTAL_FILE_STORAGE_BYTES: ${MAX_TOTAL_FILE_STORAGE_BYTES:-5368709120}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI:-}
      GOOGLE_CALENDAR_WEBHOOK_URL: ${GOOGLE_CALENDAR_WEBHOOK_URL:-}
      TOKEN_ENCRYPTION_KEY: ${TOKEN_ENCRYPTION_KEY:-}
      RUST_LOG: prosepect_api=info,tower_http=info
    depends_on:
      postgres:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:3000/ready"]
      interval: 5s
      timeout: 3s
      retries: 20

  worker:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    entrypoint: ["prosepect-worker"]
    environment:
      APP_ENV: ${APP_ENV:-development}
      DATABASE_URL: postgres://prosepect:${POSTGRES_PASSWORD:-prosepect}@postgres:5432/prosepect
      DATABASE_MAX_CONNECTIONS: 5
      ALLOW_INSECURE_DEV_AUTH: ${ALLOW_INSECURE_DEV_AUTH:-true}
      INVITE_ONLY: ${INVITE_ONLY:-false}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI:-}
      GOOGLE_CALENDAR_WEBHOOK_URL: ${GOOGLE_CALENDAR_WEBHOOK_URL:-}
      TOKEN_ENCRYPTION_KEY: ${TOKEN_ENCRYPTION_KEY:-}
      RUST_LOG: prosepect_api=info
    depends_on:
      postgres:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "127.0.0.1:8080:80"

volumes:
  postgres-data:
  minio-data:
