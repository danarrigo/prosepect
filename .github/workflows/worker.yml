name: Synchronization worker

on:
  schedule:
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: production-synchronization-worker
  cancel-in-progress: false

jobs:
  synchronize:
    if: vars.PROSEPECT_WORKER_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Wake API and process one synchronization job
        env:
          WORKER_TRIGGER_TOKEN: ${{ secrets.PROSEPECT_WORKER_TRIGGER_TOKEN }}
        run: |
          if [ -z "$WORKER_TRIGGER_TOKEN" ]; then
            echo '::error::Worker trigger token is not configured.'
            exit 1
          fi
          curl \
            --fail-with-body \
            --silent \
            --show-error \
            --retry 2 \
            --retry-all-errors \
            --connect-timeout 20 \
            --max-time 180 \
            --header "Authorization: Bearer ${WORKER_TRIGGER_TOKEN}" \
            --request POST \
            https://api.prosepect.com/internal/synchronization/run
      - name: Verify API and database readiness (not provider sync success)
        if: always()
        run: |
          curl \
            --fail \
            --silent \
            --show-error \
            --connect-timeout 10 \
            --max-time 30 \
            --output "$RUNNER_TEMP/prosepect-ready.json" \
            https://api.prosepect.com/ready
          jq --exit-status '.status == "ready"' "$RUNNER_TEMP/prosepect-ready.json"
