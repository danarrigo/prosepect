name: Synchronization worker

on:
  schedule:
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-synchronization-worker
  cancel-in-progress: false

jobs:
  synchronize:
    if: vars.PROSEPECT_WORKER_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - name: Wake API and process one synchronization job
        env:
          WORKER_TRIGGER_TOKEN: ${{ secrets.PROSEPECT_WORKER_TRIGGER_TOKEN }}
        run: python3 scripts/worker_request.py run
      - name: Verify API and database readiness (not provider sync success)
        if: always()
        run: python3 scripts/worker_request.py ready
