name: Dependency security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "43 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Install checksum-pinned Gitleaks
        run: |
          curl --fail --silent --show-error --location --retry 3 --max-time 120 \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            --output /tmp/gitleaks.tar.gz
          echo '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  /tmp/gitleaks.tar.gz' | sha256sum --check
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
      - name: Scan complete history with fully redacted output
        run: /tmp/gitleaks git . --redact --log-opts='--all' --report-format json --report-path /tmp/gitleaks.json
      - name: Preserve redacted secret-scan evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: secret-scan
          path: /tmp/gitleaks.json
          retention-days: 14
          if-no-files-found: warn

  rust-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
          fallback: none
      # Preserve structured evidence even when an advisory is found. The next
      # mandatory step fails on every advisory or warning, without exceptions.
      - name: Record all Rust advisories
        continue-on-error: true
        run: cargo audit --file Cargo.lock --deny warnings --json > cargo-audit-full.json
      - name: Block every Rust advisory
        run: cargo audit --file Cargo.lock --deny warnings 2>&1 | tee cargo-audit-gate.txt
      - name: Preserve Rust audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rust-dependency-audit
          path: |
            cargo-audit-full.json
            cargo-audit-gate.txt
          retention-days: 14
          if-no-files-found: error

  npm-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Audit the complete npm lockfile (including dev dependencies)
        run: npm audit --package-lock-only --include=dev --audit-level=low --json > npm-audit.json
      - name: Preserve npm audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: npm-dependency-audit
          path: npm-audit.json
          retention-days: 14
          if-no-files-found: error
